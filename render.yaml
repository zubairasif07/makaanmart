databases:
  - name: makaanmart-db
    databaseName: makaanmart
    user: makaanmart
    plan: free
    region: singapore

services:
  - type: web
    name: makaanmart-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: APP_NAME
        value: MakaanMart
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: makaanmart-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://makaanmart.vercel.app,http://localhost:5173
